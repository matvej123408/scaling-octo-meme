<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>OpenWalk Пеший Навигатор</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:#111;
}

#map{
    width:100%;
    height:100%;
}

#panel{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;

    z-index:1000;

    background:#1c1c1c;

    border-radius:18px;

    padding:12px;

    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input,
button,
select{
    width:100%;
    margin-top:8px;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,
select{
    background:#2a2a2a;
    color:white;
}

button{
    background:#1e88ff;
    color:white;
    font-weight:bold;
}

#toggleUI{
    background:#ff9800;
}

#info{
    margin-top:10px;
    color:white;
    line-height:1.5;
}

.saved{
    margin-top:10px;
    max-height:150px;
    overflow:auto;
}

.card{
    background:#2a2a2a;
    color:white;
    padding:10px;
    border-radius:12px;
    margin-top:8px;
}

.small{
    font-size:12px;
    opacity:0.7;
}

</style>
</head>
<body>

<div id="panel">

<input id="start"
placeholder="Старт">

<input id="end"
placeholder="Куда идти">

<select id="filter">

<option value="normal">
Только пешие дороги
</option>

<option value="forest">
Лесные тропы
</option>

<option value="quiet">
Тихие дороги
</option>

</select>

<button onclick="route()">
Построить маршрут
</button>

<button onclick="myLocation()">
Моё местоположение
</button>

<button onclick="saveRoute()">
Сохранить маршрут
</button>

<button onclick="startRec()">
Начать запись
</button>

<button onclick="stopRec()">
Остановить запись
</button>

<button id="toggleUI"
onclick="toggleUI()">
Скрыть меню
</button>

<div id="info">
Маршрут не построен
</div>

<div class="saved"
id="saved">
</div>

</div>

<div id="map"></div>

<script src=
"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

const map =
L.map('map').setView(
[50.1109,8.6821],13
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

let routeLayer;
let watchId;
let track = [];
let hiddenUI = false;

async function searchPlace(q){

    if(q.includes(",")){

        const p = q.split(",");

        return [{
            lat:p[0],
            lon:p[1]
        }];
    }

    const url =
`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`;

    const r =
    await fetch(url);

    return await r.json();
}

async function route(){

    const s =
    document.getElementById("start").value;

    const e =
    document.getElementById("end").value;

    const filter =
    document.getElementById("filter").value;

    if(!s || !e){

        alert("Введите точки");

        return;
    }

    const sData =
    await searchPlace(s);

    const eData =
    await searchPlace(e);

    if(!sData.length || !eData.length){

        alert("Точка не найдена");

        return;
    }

    const sLat = sData[0].lat;
    const sLon = sData[0].lon;

    const eLat = eData[0].lat;
    const eLon = eData[0].lon;

    let exclude =
    "motorway,trunk,primary,secondary";

    if(filter === "forest"){

        exclude =
        "motorway,trunk";
    }

    if(filter === "quiet"){

        exclude =
        "motorway,trunk,primary";
    }

    const url =
`https://router.project-osrm.org/route/v1/foot/${sLon},${sLat};${eLon},${eLat}?overview=full&geometries=geojson&exclude=${exclude}`;

    const res =
    await fetch(url);

    const data =
    await res.json();

    if(!data.routes){

        alert("Маршрут не найден");

        return;
    }

    if(routeLayer){

        map.removeLayer(routeLayer);
    }

    routeLayer =
    L.geoJSON(
    data.routes[0].geometry,
    {
        style:{
            color:"#00ff88",
            weight:8,
            opacity:1
        }
    }).addTo(map);

    map.fitBounds(
        routeLayer.getBounds()
    );

    const meters =
    data.routes[0].distance;

    const minutes =
    Math.round(
        data.routes[0].duration / 60
    );

    document.getElementById("info")
    .innerHTML =
    `
    🚶 ${minutes} мин пешком<br>
    📏 ${(meters/1000).toFixed(2)} км<br>
    ✅ Только пешие дороги<br>
    ❌ Без машин
    `;
}

function myLocation(){

    navigator.geolocation
    .getCurrentPosition(pos=>{

        const lat =
        pos.coords.latitude;

        const lon =
        pos.coords.longitude;

        map.setView(
        [lat,lon],16
        );

        L.marker([lat,lon])
        .addTo(map);

        document.getElementById("start")
        .value =
        `${lat},${lon}`;
    });
}

function saveRoute(){

    const start =
    document.getElementById("start")
    .value;

    const end =
    document.getElementById("end")
    .value;

    if(!start || !end){
        return;
    }

    let routes =
    JSON.parse(
    localStorage.getItem("routes")
    || "[]"
    );

    routes.push({

        start,
        end,

        time:
        new Date()
        .toLocaleString()

    });

    localStorage.setItem(
    "routes",
    JSON.stringify(routes)
    );

    loadSaved();

    alert("Маршрут сохранён");
}

function loadSaved(){

    const div =
    document.getElementById("saved");

    div.innerHTML = "";

    const routes =
    JSON.parse(
    localStorage.getItem("routes")
    || "[]"
    );

    routes.reverse()
    .forEach((r,index)=>{

        div.innerHTML +=
        `
        <div class="card">

        <b>${r.start}</b><br>

        ➜ ${r.end}<br>

        <div class="small">
        ${r.time}
        </div>

        <button
        onclick="loadRoute(${index})">

        Открыть

        </button>

        </div>
        `;
    });
}

function loadRoute(index){

    const routes =
    JSON.parse(
    localStorage.getItem("routes")
    || "[]"
    );

    const r =
    routes.reverse()[index];

    document.getElementById("start")
    .value =
    r.start;

    document.getElementById("end")
    .value =
    r.end;

    route();
}

function startRec(){

    track = [];

    watchId =
    navigator.geolocation
    .watchPosition(pos=>{

        const lat =
        pos.coords.latitude;

        const lon =
        pos.coords.longitude;

        track.push([lat,lon]);

        if(routeLayer){

            map.removeLayer(
            routeLayer
            );
        }

        routeLayer =
        L.polyline(track,{

            color:"red",
            weight:5

        }).addTo(map);

    });

    alert("Запись маршрута началась");
}

function stopRec(){

    navigator.geolocation
    .clearWatch(watchId);

    localStorage.setItem(
    "track",
    JSON.stringify(track)
    );

    alert("Трек сохранён");
}

function toggleUI(){

    const panel =
    document.getElementById("panel");

    const btn =
    document.getElementById("toggleUI");

    if(!hiddenUI){

        Array.from(
        panel.children
        ).forEach(el=>{

            if(
            el.id !== "toggleUI"
            ){
                el.style.display =
                "none";
            }

        });

        panel.style.width =
        "auto";

        panel.style.right =
        "auto";

        btn.style.display =
        "block";

        btn.innerText =
        "Показать меню";

        hiddenUI = true;

    }else{

        Array.from(
        panel.children
        ).forEach(el=>{

            el.style.display =
            "block";

        });

        btn.innerText =
        "Скрыть меню";

        hiddenUI = false;
    }
}

loadSaved();

</script>

</body>
</html>
