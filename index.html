<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>OpenWalk</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:#111;
}

#map{
    width:100%;
    height:100%;
}

#panel{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;

    z-index:1000;

    background:#1b1b1b;

    border-radius:16px;

    padding:12px;

    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input,
button,
select{
    width:100%;
    margin-top:8px;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,
select{
    background:#2a2a2a;
    color:white;
}

button{
    background:#1e88ff;
    color:white;
    font-weight:bold;
}

#toggleBtn{
    background:#ff9800;
}

#info{
    color:white;
    margin-top:10px;
    line-height:1.5;
}

.hidden{
    display:none;
}

</style>
</head>
<body>

<div id="panel">

<input id="start"
placeholder="Откуда">

<input id="end"
placeholder="Куда">

<select id="mode">
<option value="foot">
Пешком
</option>
</select>

<button onclick="buildRoute()">
Построить маршрут
</button>

<button onclick="useGPS()">
Моё местоположение
</button>

<button id="toggleBtn"
onclick="toggleMenu()">
Скрыть меню
</button>

<div id="info">
Маршрут не построен
</div>

</div>

<div id="map"></div>

<script src=
"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

const map =
L.map('map').setView(
[50.1109,8.6821],
13
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

let routeLayer;
let menuHidden = false;

async function searchPlace(text){

    if(text.includes(",")){

        const p = text.split(",");

        return [{
            lat:p[0],
            lon:p[1]
        }];
    }

    const url =
`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(text)}`;

    const res =
    await fetch(url);

    return await res.json();
}

async function buildRoute(){

    const start =
    document.getElementById("start").value;

    const end =
    document.getElementById("end").value;

    if(!start || !end){

        alert("Введите точки");

        return;
    }

    try{

        const sData =
        await searchPlace(start);

        const eData =
        await searchPlace(end);

        if(
        !sData.length ||
        !eData.length
        ){

            alert("Точка не найдена");

            return;
        }

        const sLat = sData[0].lat;
        const sLon = sData[0].lon;

        const eLat = eData[0].lat;
        const eLon = eData[0].lon;

        const routeURL =
`https://router.project-osrm.org/route/v1/foot/${sLon},${sLat};${eLon},${eLat}?overview=full&geometries=geojson`;

        const routeRes =
        await fetch(routeURL);

        const routeData =
        await routeRes.json();

        if(
        !routeData.routes ||
        !routeData.routes.length
        ){

            alert("Маршрут не найден");

            return;
        }

        if(routeLayer){

            map.removeLayer(routeLayer);
        }

        routeLayer =
        L.geoJSON(
        routeData.routes[0].geometry,
        {
            style:{
                color:"#00ff88",
                weight:7
            }
        }).addTo(map);

        map.fitBounds(
        routeLayer.getBounds()
        );

        const km =
        (
        routeData.routes[0].distance
        /1000
        ).toFixed(2);

        const minutes =
        Math.round(
        routeData.routes[0].duration
        /60
        );

        document.getElementById("info")
        .innerHTML =
        `
        🚶 ${minutes} мин пешком<br>
        📏 ${km} км<br>
        ✅ Только пешие маршруты
        `;

    }catch(e){

        console.log(e);

        alert("Ошибка маршрута");
    }
}

function useGPS(){

    navigator.geolocation
    .getCurrentPosition(pos=>{

        const lat =
        pos.coords.latitude;

        const lon =
        pos.coords.longitude;

        map.setView(
        [lat,lon],
        16
        );

        L.marker([lat,lon])
        .addTo(map);

        document.getElementById("start")
        .value =
        `${lat},${lon}`;

    });
}

function toggleMenu(){

    const panel =
    document.getElementById("panel");

    const btn =
    document.getElementById("toggleBtn");

    if(!menuHidden){

        Array.from(
        panel.children
        ).forEach(el=>{

            if(
            el.id !== "toggleBtn"
            ){

                el.classList.add(
                "hidden"
                );
            }

        });

        btn.classList.remove(
        "hidden"
        );

        btn.innerText =
        "Показать меню";

        menuHidden = true;

    }else{

        Array.from(
        panel.children
        ).forEach(el=>{

            el.classList.remove(
            "hidden"
            );

        });

        btn.innerText =
        "Скрыть меню";

        menuHidden = false;
    }
}

</script>

</body>
</html>
